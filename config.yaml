# Options: "claimreview_plus", "factors"
dataset: "factors"                 
model: "cf.llama-3.1-70b-instruct"
api_url: "https://api.avalai.ir/v1/chat/completions"

labels:
  - Supported
  - Refuted
  - Not Enough Information
  - Misleading

temporal_split: "2024-04-01"
date_format: "%d-%m-%Y"

rate_limit:
  max_retries: 5
  initial_retry_delay: 0.5
  sleep_between_calls: 0.1

sampling:
  max_samples: null
  balanced: true
  seed: 42

display_every_n: 10

output_root: "results"
hf_token_env: "HF_TOKEN"
api_key_env: "AVALAI_API_KEY"
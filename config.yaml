# Options: "claimreview_plus", "factors"
dataset: "claimreview_plus"                 
model: "qwen2.5-72b-instruct"
api_url: "https://api.avalapis.ir/v1/chat/completions"

labels:
  - Supported
  - Refuted
  - Not Enough Information
  - Misleading

# Prompt methods to evaluate (can be one or more)
prompt_methods:
  - naive
  - definition_rich
  - anti_nei
  - cvp

temporal_split: "2024-09-01"
date_format: "%d-%m-%Y"

rate_limit:
  max_retries: 5
  initial_retry_delay: 0.5
  sleep_between_calls: 0.1

sampling:
  max_samples: null
  balanced: true
  seed: 42

display_every_n: 10

output_root: "results"
hf_token_env: "HF_TOKEN"
api_key_env: "AVALAI_API_KEY"

datasets_config: "datasets.yaml"
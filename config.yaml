dataset: "matteroffact_all"

model: "gpt-4o-mini-2024-07-18"
api_url: "https://api.avalai.ir/v1/chat/completions"

labels:
  - Supported
  - Refuted

prompt_methods:
  - naive
  - strong_baseline_short
  - cognitive_bias_aware

temporal_split: "2023-10-01"
date_format: "%Y-%m-%d"

rate_limit:
  max_retries: 5
  initial_retry_delay: 0.5
  sleep_between_calls: 0.1

sampling:
  max_samples: null
  balanced: false
  seed: 42

display_every_n: 10

output_root: "results"
api_key_env: "AVALAI_API_KEY"

datasets_config: "datasets.yaml"
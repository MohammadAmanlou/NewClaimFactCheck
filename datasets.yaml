# Dataset definitions – maps a dataset name to a local file and column mapping.
# All paths are relative to the data_dir specified in config.yaml.

claimreview_plus:
  type: csv
  path: ".\\data\\crp_with_bias.csv"
  mapping:
    claim_id: "id"
    claim: "text"
    claim_date: "date"        
    label: "label"
    speaker: "author"
    detected_biases: "all_detected_biases"
  filter:
    exclude_labels: []
    label_column: "normalised_rating"
  date_format: "%Y-%m-%d %H:%M:%S%z"      # ISO format (we'll strip time part)
  is_test: false

factors:
  type: csv
  path: "FACTor/FACTors.csv"
  mapping:
    claim_id: "claim_id"
    claim: "claim"
    claim_date: "date_published"        # will be parsed with date_format
    label: "normalised_rating"
    speaker: "author"
  filter:
    exclude_labels: ["other", "unverifiable"]
    label_column: "normalised_rating"
  date_format: "%Y-%m-%dT%H:%M:%S"      # ISO format (we'll strip time part)
  is_test: false

fever_train:
  type: json
  path: "AVeriTeC_FEVER/train.json"
  mapping:
    claim_id: "claim_id"
    claim: "claim"
    claim_date: "claim_date"            # already in dd-mm-yyyy format
    label: "label"
    speaker: "speaker"
  date_format: "%d-%m-%Y"
  is_test: false

fever_dev:
  type: json
  path: "AVeriTeC_FEVER/data_dev.json"
  mapping:
    claim_id: "claim_id"
    claim: "claim"
    claim_date: "claim_date"
    label: "label"
    speaker: "speaker"
  date_format: "%d-%m-%Y"
  is_test: false

fever_test_2023_2024:
  type: json
  path: "AVeriTeC_FEVER/test_2023_2024.json"
  mapping:
    claim_id: "claim_id"
    claim: "claim"
    claim_date: "claim_date"
    speaker: "speaker"
  date_format: "%d-%m-%Y"
  is_test: true                # no label column
  # original_data will be preserved

fever_test_2025:
  type: json
  path: "AVeriTeC_FEVER/test_2025.json"
  mapping:
    claim_id: "claim_id"
    claim: "claim"
    claim_date: "claim_date"
    speaker: "speaker"
  date_format: "%d-%m-%Y"
  is_test: true